<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>YT Chat Translator</title>
<style>
  body {
    width: 260px;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    padding: 14px;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  label {
    font-size: 13px;
  }
  select, input {
    font-size: 13px;
    padding: 3px 4px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: #ccc; transition: .2s; border-radius: 20px;
  }
  .slider:before {
    position: absolute; content: ""; height: 14px; width: 14px;
    left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #ff0033; }
  input:checked + .slider:before { transform: translateX(16px); }
  .footer {
    margin-top: 10px;
    font-size: 11px;
    color: #777;
  }
  a { color: #ff0033; text-decoration: none; }
</style>
</head>
<body>
  <h1 id="popupTitle">YouTube Live Chat Translatorの設定</h1>

  <div class="row">
    <label for="enabled" id="enableLabel">翻訳を有効にする</label>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label for="targetLang" id="targetLangLabel">翻訳先の言語</label>
    <select id="targetLang">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="ru">Русский</option>
      <option value="th">ไทย</option>
      <option value="vi">Tiếng Việt</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </div>

  <div class="footer">
    <span id="footerPrefix">詳細設定(APIキー・エンジン)や翻訳除外ワードの設定は</span>
    <a href="#" id="openOptions">オプション画面</a><span id="footerSuffix">から。</span>
  </div>

  <script src="popup-i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
